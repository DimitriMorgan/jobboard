name: Actualiser les offres et publier le site

on:
  schedule:
    # 03:17 UTC (05:17 Paris en été, 04:17 en hiver). GitHub retarde les tâches planifiées à l'heure pile
    # (constaté : 4 à 6 h de retard pour « 0 5 * * * ») : minute creuse et marge pour des données prêtes le matin.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources à actualiser, séparées par des virgules (vide = toutes). Ex. : linkedin-posts'
        required: false
        default: ''
      linkedin_urls:
        description: 'Posts ou offres LinkedIn à ajouter (URL séparées par des espaces)'
        required: false
        default: ''
  push:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: jobboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Sur push, ne déployer que depuis la branche par défaut (le planning et le bouton Actualiser s'y exécutent déjà).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Récupérer les données précédentes (branche data)
        run: |
          mkdir -p data/static
          if git fetch origin data --depth=1 2>/dev/null; then
            git archive origin/data | tar -x -C data/static
            echo "Données précédentes récupérées"
          else
            echo "Pas encore de branche data : première actualisation"
          fi

      - name: Actualiser les offres
        run: npm run refresh:static
        env:
          ONLY_SOURCES: ${{ inputs.sources }}
          LINKEDIN_POST_URLS: ${{ inputs.linkedin_urls }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || 60 }}
          LINKEDIN_MAX_REQUESTS: ${{ vars.LINKEDIN_MAX_REQUESTS || 1300 }}
          LINKEDIN_DETAIL_LIMIT: ${{ vars.LINKEDIN_DETAIL_LIMIT || 1000 }}
          DETAIL_FETCH_LIMIT: ${{ vars.DETAIL_FETCH_LIMIT || 60 }}
          DISABLED_SOURCES: ${{ vars.DISABLED_SOURCES }}
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          WTTJ_ALGOLIA_APP_ID: ${{ vars.WTTJ_ALGOLIA_APP_ID }}
          WTTJ_ALGOLIA_API_KEY: ${{ vars.WTTJ_ALGOLIA_API_KEY }}

      - name: Publier les données sur la branche data
        run: |
          git config user.name "jobboard-bot"
          git config user.email "jobboard-bot@users.noreply.github.com"
          rm -rf /tmp/data-wt
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data --depth=1
            git worktree add /tmp/data-wt -B data origin/data
          else
            git worktree add --detach /tmp/data-wt
            (cd /tmp/data-wt && git checkout --orphan data)
          fi
          # On repart d'un dossier vide : les fichiers qui n'existent plus (ancien descriptions.json) disparaissent.
          (cd /tmp/data-wt && git rm -rfq . 2>/dev/null || true)
          cp -r data/static/jobs.json data/static/descriptions /tmp/data-wt/
          cd /tmp/data-wt
          git add -A
          git commit -m "Données du $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "Aucun changement"
          git push origin data

      - name: Construire le site statique
        run: |
          export VITE_BASE="/${GITHUB_REPOSITORY#*/}/"
          npm run build:static
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_GITHUB_BRANCH: ${{ github.ref_name }}

      - name: Ajouter les données au site
        run: |
          mkdir -p client/dist/data
          cp -r data/static/jobs.json data/static/descriptions client/dist/data/

      - name: Déployer le site sur la branche gh-pages
        run: |
          touch client/dist/.nojekyll
          rm -rf /tmp/pages-wt
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add /tmp/pages-wt -B gh-pages origin/gh-pages
            (cd /tmp/pages-wt && git rm -rfq . 2>/dev/null || true)
          else
            git worktree add --detach /tmp/pages-wt
            (cd /tmp/pages-wt && git checkout --orphan gh-pages && git rm -rfq . 2>/dev/null || true)
          fi
          cp -r client/dist/. /tmp/pages-wt/
          cd /tmp/pages-wt
          git add -A
          git commit -m "Site du $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "Aucun changement"
          git push origin gh-pages
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          echo "::notice::Site : https://${owner,,}.github.io/${repo}/ (si 404 : Settings → Pages → Source « Deploy from a branch » → gh-pages / root)"
